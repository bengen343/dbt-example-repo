version: 2

sources:
  - name: auth0
    description: "Auth0 data ingested via Fivetran."
    database: "{{ var('DBT_SNOWFLAKE_SOURCE_DATABASE', default=env_var('DBT_SNOWFLAKE_DATABASE')) }}"
    schema: auth0
    tables:
      - name: client
      - name: connection
      - name: logs
        config:
          freshness:
            warn_after: {count: 24, period: hour}
          loaded_at_field: date
      - name: users
        config:
          freshness:
            warn_after: {count: 72, period: hour}
          loaded_at_field: updated_at
      - name: user_identities
      - name: user_metadata


  - name: snowflake
    description: >
      "Snowflake account usage data. The tables here are views created in 'dbt_loom_prod' to give dbt access to the
      information without exposing Snowflake's actual 'account_usage' appliaction to the dbt service accounts.
      And to maintain source consistency."
    database: "{{ var('DBT_SNOWFLAKE_SOURCE_DATABASE', default=env_var('DBT_SNOWFLAKE_DATABASE')) }}"
    schema: snowflake
    config:
      freshness:
        warn_after: {count: 24, period: hour}
      loaded_at_field: start_time
    tables:
      - name: account_usage__query_attribution_history
      - name: account_usage__query_history
      - name: account_usage__warehouse_metering_history
