        description: "{{ doc('info_sources_dbt') }}"

      - name: INFO_TAGS_DBT
        description: "{{ doc('info_tags_dbt') }}"

      - name: MET_CREDITS_ATTRIBUTED_COMPUTE
        description: "{{ doc('met_credits_attributed_compute') }}"

      - name: MET_CREDITS_USED_QUERY_ACCELERATION
        description: "{{ doc('met_credits_used_query_acceleration') }}"

      - name: SF_PARENT_QUERY_ID
        description: "{{ doc('sf_parent_query_id') }}"

      - name: SF_QUERY_ID
        description: "{{ doc('sf_query_id') }}"
