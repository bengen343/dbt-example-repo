          - not_null

      - name: DBT_INVOCATION_ID
        description: "{{ doc('dbt_invocation_id') }}"

      - name: DIM_END_DATETIME
        description: "{{ doc('dim_end_datetime') }}"

      - name: DIM_INCREMENTAL_STRATEGY_DBT
