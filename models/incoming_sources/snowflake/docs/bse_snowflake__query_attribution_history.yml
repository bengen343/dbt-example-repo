      - name: DIM_MODEL_NAME_DBT
        description: "{{ doc('dim_model_name_dbt') }}"

      - name: DIM_PACKAGE_NAME_DBT
        description: "{{ doc('dim_package_name_dbt') }}"

      - name: DIM_START_DATETIME
        description: "{{ doc('dim_start_datetime') }}"

      - name: DIM_USER_NAME_DBT
        description: "{{ doc('dim_user_name_dbt') }}"

      - name: DIM_USER_NAME_SNOWFLAKE
        description: "{{ doc('dim_user_name_snowflake') }}"

      - name: DIM_WAREHOUSE_NAME
